<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CI/CD Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>AWS CI/CD Pipeline Dashboard</h1>
            <p>Automated Application Deployment using Docker and AWS</p>
        </header>

        <div class="cards">
            <div class="card">
                <h2>GitHub</h2>
                <p>Source Code Management</p>
            </div>

            <div class="card">
                <h2>Docker</h2>
                <p>Build and Package Application</p>
            </div>

            <div class="card">
                <h2>AWS CodeBuild</h2>
                <p>Build and Test Process</p>
            </div>

            <div class="card">
                <h2>AWS ECS</h2>
                <p>Container Deployment</p>
            </div>
        </div>

        <div class="status">
            <h2>Project Status: Ready for CI/CD</h2>
        </div>
    </div>

</body>
</html>
